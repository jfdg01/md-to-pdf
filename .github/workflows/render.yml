name: Render test.md to PDF

on:
  push:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
          pip install -r requirements.txt

      - name: Convert test.md to PDF
        run: python3 src/md_to_pdf.py test.md

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: test-pdf
          path: test.pdf
